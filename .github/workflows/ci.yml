name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: gestion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:app_user_pwd@localhost:5432/gestion
      DATABASE_ADMIN_URL: postgres://app_owner:owner@localhost:5432/gestion
      APP_DB_PASSWORD: app_user_pwd
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de production
        run: docker build --target run -t ze-gestion-app .
      - name: Vérifier la configuration de déploiement
        run: |
          printf 'DOMAIN=example.com\nDB_OWNER_PASSWORD=x\nDB_APP_PASSWORD=y\n' > deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config -q
