name: ZE LOYER Windows

# Construit l'installateur Windows de ZE LOYER (ZE-LOYER-Installation-x.y.z.exe) sur une vraie machine Windows.
# Le logiciel contient sa propre base PostgreSQL et le serveur ZE LOYER : il fonctionne sans internet ni serveur.
# Avant de publier l'installateur, le test démarre la base, les migrations, les données de démo et le serveur,
# puis fait un vrai parcours dans Chrome (connexion, paiement, quittance PDF), sur les fichiers assemblés puis empaquetés.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ze-loyer/desktop/**", ".github/workflows/ze-loyer-windows.yml"]
  push:
    branches: [main]
    paths: ["ze-loyer/**", "!ze-loyer/mobile/**", ".github/workflows/ze-loyer-windows.yml"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ze-loyer/package-lock.json
            ze-loyer/desktop/package-lock.json
      - run: npm ci
        working-directory: ze-loyer
      - run: npm ci
        working-directory: ze-loyer/desktop
      - name: Assembler l'application
        run: node build/prepare.mjs --target=win
        working-directory: ze-loyer/desktop
      - name: Test de démarrage et parcours (base intégrée, données de démo, serveur, Chrome)
        timeout-minutes: 8
        run: node build/smoke-test.cjs
        working-directory: ze-loyer/desktop
        env:
          ZE_PG_BIN: ${{ github.workspace }}\ze-loyer\desktop\app\pgsql\bin
          ZE_DIAG_DIR: ${{ runner.temp }}
      - name: Construire l'installateur
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: ze-loyer/desktop
      # Même test sur les fichiers réellement mis dans l'installateur (un fichier oublié au packaging fait échouer ici)
      - name: Test de l'application empaquetée
        timeout-minutes: 8
        run: node build/smoke-test.cjs "$env:TEMP\ze-loyer-packaged"
        working-directory: ze-loyer/desktop
        env:
          ZE_RESOURCES: ${{ github.workspace }}\ze-loyer\desktop\dist\win-unpacked\resources
          ZE_PG_BIN: ${{ github.workspace }}\ze-loyer\desktop\dist\win-unpacked\resources\pgsql\bin
          ZE_DIAG_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZE-LOYER-Windows
          path: ze-loyer/desktop/dist/*.exe
          retention-days: 30
      - name: Journaux en cas d'échec
        if: failure()
        shell: bash
        run: cat "$TEMP/ze-loyer-smoke/logs/"*.log "$TEMP/ze-loyer-packaged/logs/"*.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ZE-LOYER-Windows-diagnostic
          path: ${{ runner.temp }}/ze-loyer-echec-*.png
          if-no-files-found: ignore
