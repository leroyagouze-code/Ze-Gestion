name: ZE LOYER

on:
  pull_request:
    paths: ["ze-loyer/**", ".github/workflows/ze-loyer.yml"]
  push:
    branches: [main]
    paths: ["ze-loyer/**", ".github/workflows/ze-loyer.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ze-loyer
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zl_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: zeloyer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zl_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://zl_owner:owner@localhost:5432/zeloyer_test
      TEST_DATABASE_URL: postgres://zl_owner:owner@localhost:5432/zeloyer_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ze-loyer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
