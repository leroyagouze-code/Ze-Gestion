name: Appli Android

# Construit l'APK autonome (ZE Gestion + base de données dans le téléphone, sans internet),
# vérifie le démarrage sur la CI, puis sur un téléphone virtuel Android.
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "src/**", "drizzle/**", "package-lock.json"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assembler l'application Node
        run: node android/build/prepare.mjs

      - name: Test de démarrage (base embarquée, migrations, serveur)
        timeout-minutes: 5
        run: |
          cd android/build/nodejs-project
          node main.cjs /tmp/ze-android > /tmp/ze-android.log 2>&1 &
          for i in $(seq 1 120); do [ -f /tmp/ze-android/ready.json ] && break; sleep 1; done
          cat /tmp/ze-android/ready.json
          grep -q '"url"' /tmp/ze-android/ready.json
          URL=$(node -p 'require("/tmp/ze-android/ready.json").url')
          curl -fsS -o /dev/null -w "login %{http_code}\n" "$URL/login"
          curl -fsS -o /dev/null -w "signup %{http_code}\n" "$URL/signup"

      # Node compilé pour Android (Termux, avec ICU complet pour les dates et montants)
      - name: Récupérer Node pour Android
        run: |
          sudo apt-get install -y -q patchelf
          node android/build/fetch-node.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Construire les APK
        working-directory: android
        env:
          ZE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ZE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ZE_KEYSTORE_B64" ]; then echo "$ZE_KEYSTORE_B64" | base64 -d > /tmp/release.p12; export ZE_KEYSTORE=/tmp/release.p12; fi
          gradle assembleRelease --no-daemon --stacktrace
          V=$(node -p 'require("./app/version.json").versionName')
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/ZE-Gestion-$V-$abi.apk"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ZE-Gestion-Android
          path: android/dist/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: android/dist/*x86_64.apk
          retention-days: 3
      - name: Journaux en cas d'échec
        if: failure()
        run: cat /tmp/ze-android.log /tmp/ze-android/logs/*.log 2>/dev/null | tail -200 || true

  emulateur:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et lancer l'appli sur un téléphone virtuel (Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disable-animations: true
          script: bash android/build/emulator-test.sh apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-emulateur
          path: /tmp/emu
          retention-days: 7
