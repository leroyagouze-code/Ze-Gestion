name: ZE LOYER Android

# Construit l'application Android ZE LOYER (fichier .apk à installer ou à partager).
# Adresse du serveur : variable du dépôt ZE_LOYER_URL (Settings → Secrets and variables → Actions → Variables),
# ou saisie au lancement manuel (onglet Actions → « ZE LOYER Android » → Run workflow).
# Signature : secrets ZE_KEYSTORE_BASE64, ZE_KEYSTORE_PASSWORD, ZE_KEY_ALIAS, ZE_KEY_PASSWORD (voir ze-loyer/mobile/README.md).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse du site ZE LOYER (vide = variable ZE_LOYER_URL). Version de test : http://IP-DU-PC:3000"
        required: false
      test_http:
        description: "Version de TEST reliée à un PC (autorise http://, à ne pas distribuer)"
        type: boolean
        default: false
  pull_request:
    paths: ["ze-loyer/mobile/**", ".github/workflows/ze-loyer-android.yml"]
  push:
    branches: [main]
    paths: ["ze-loyer/mobile/**", ".github/workflows/ze-loyer-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ze-loyer/mobile
    env:
      ZE_LOYER_URL: ${{ inputs.server_url || vars.ZE_LOYER_URL }}
      ZE_LOYER_ALLOW_HTTP: ${{ inputs.test_http && '1' || '' }}
      ZE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ze-loyer/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Configurer l'adresse du serveur et synchroniser le projet Android
        run: npm run sync
      - name: Clé de signature (si les secrets sont définis)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zeloyer.jks"
            echo "ZE_KEYSTORE_FILE=$RUNNER_TEMP/zeloyer.jks" >> "$GITHUB_ENV"
            echo "APK_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé de signature (secret ZE_KEYSTORE_BASE64) : APK de test signé avec une clé temporaire. Les mises à jour demanderont de désinstaller l'ancienne version."
            echo "APK_KIND=debug" >> "$GITHUB_ENV"
          fi
      - name: Construire l'APK
        working-directory: ze-loyer/mobile/android
        env:
          ZE_KEYSTORE_PASSWORD: ${{ secrets.ZE_KEYSTORE_PASSWORD }}
          ZE_KEY_ALIAS: ${{ secrets.ZE_KEY_ALIAS }}
          ZE_KEY_PASSWORD: ${{ secrets.ZE_KEY_PASSWORD }}
        run: |
          if [ "$APK_KIND" = release ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
          mkdir -p ../dist
          cp app/build/outputs/apk/$APK_KIND/app-$APK_KIND.apk "../dist/ZE-LOYER-1.0.${ZE_BUILD_NUMBER}.apk"
      - name: Vérifier l'APK (adresse du serveur intégrée, signature)
        run: |
          APK=$(ls dist/*.apk)
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"appId": "com.zegroup.zeloyer"'
          if [ -n "$ZE_LOYER_URL" ]; then unzip -p "$APK" assets/capacitor.config.json | grep -q "\"url\": \"${ZE_LOYER_URL%/}/connexion\""; fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test_http && 'ZE-LOYER-Android-TEST' || 'ZE-LOYER-Android' }}
          path: ze-loyer/mobile/dist/*.apk
          retention-days: 30

  # Test de bout en bout sur un vrai émulateur Android 14 (accéléré KVM) : APK de TEST relié à un site de démo local.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zl_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: zeloyer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zl_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://zl_owner:owner@localhost:5432/zeloyer
      APP_URL: http://10.0.2.2:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ze-loyer/package-lock.json
            ze-loyer/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Site ZE LOYER de démo (mode développement, http)
        working-directory: ze-loyer
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
          nohup npx next dev -p 3000 -H 0.0.0.0 > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:3000/api/health && break; sleep 2; done
          # Pré-compilation des pages du parcours (le mode dev compile à la première visite)
          for p in /connexion /mon-espace /mon-espace/quittances /api/health; do curl -s -o /dev/null -w "$p %{http_code}\n" "localhost:3000$p"; done
      - name: APK de test (serveur http://10.0.2.2:3000, débogage WebView)
        working-directory: ze-loyer/mobile
        env:
          ZE_LOYER_URL: http://10.0.2.2:3000
          ZE_LOYER_ALLOW_HTTP: "1"
        run: |
          npm ci
          npm run sync
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Parcours sur émulateur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_OUT: ${{ github.workspace }}/ze-loyer/mobile/smoke
          SMOKE_STOP_SERVER: pkill -f "next[ ]dev" ; pkill -f "next-serve[r]" ; true
          SMOKE_START_SERVER: >-
            cd ${{ github.workspace }}/ze-loyer &&
            (nohup npx next dev -p 3000 -H 0.0.0.0 >> ${{ runner.temp }}/site.log 2>&1 &) ;
            for i in $(seq 1 90); do curl -sf localhost:3000/api/health && break; sleep 2; done ;
            curl -s -o /dev/null localhost:3000/connexion
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: ze-loyer/mobile
          script: node scripts/emulator-smoke.mjs
      - name: Journal du site en cas d'échec
        if: failure()
        run: tail -100 "$RUNNER_TEMP/site.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZE-LOYER-Android-captures
          path: ze-loyer/mobile/smoke
          retention-days: 14
