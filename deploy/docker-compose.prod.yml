# Mise en production sur un serveur (VPS) : voir docs/DEPLOIEMENT.md
# Lancement : docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: ze-gestion

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD manquant}
      POSTGRES_DB: gestion
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d gestion"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applique les migrations puis s'arrête (relancé à chaque déploiement)
  migrate:
    build: { context: .., target: build }
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_ADMIN_URL: postgres://app_owner:${DB_OWNER_PASSWORD}@db:5432/gestion
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD manquant}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: .., target: run }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:${DB_APP_PASSWORD}@db:5432/gestion
      APP_URL: https://${DOMAIN:?DOMAIN manquant}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS automatique (certificat Let's Encrypt) devant l'application
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  # Sauvegarde quotidienne de la base, conservée 14 jours dans deploy/backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/gestion-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U app_owner gestion | gzip > "$$f" && echo "sauvegarde $$f"
          find /backups -name 'gestion-*.sql.gz' -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
