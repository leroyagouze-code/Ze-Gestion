# Mise en production sur un serveur (VPS) : voir docs/DEPLOIEMENT.md
# Lancement : docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: ze-gestion

# Journaux Docker limités (3 × 10 Mo par service) pour ne pas remplir le disque
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD manquant}
      POSTGRES_DB: gestion
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d gestion"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applique les migrations puis s'arrête (relancé à chaque déploiement)
  migrate:
    build: { context: .., target: build }
    command: ["npx", "tsx", "scripts/migrate.ts"]
    logging: *logging
    environment:
      DATABASE_ADMIN_URL: postgres://app_owner:${DB_OWNER_PASSWORD}@db:5432/gestion
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD manquant}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: .., target: run }
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://app_user:${DB_APP_PASSWORD}@db:5432/gestion
      APP_URL: https://${DOMAIN:?DOMAIN manquant}
      UPLOAD_DIR: /data/uploads
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      # Clé privée qui signe les licences du logiciel Windows (menu Super admin > Licences)
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-}
      PAYGATE_API_KEY: ${PAYGATE_API_KEY:-}
      # Emails (codes à 6 chiffres) : boîte noreply chez LWS. Sans SMTP_PASSWORD, envoi désactivé.
      SMTP_HOST: ${SMTP_HOST:-mail.zegroupafrica.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-noreply@zegroupafrica.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-ZE Gestion <noreply@zegroupafrica.com>}
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS automatique (certificat Let's Encrypt) devant l'application
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  # Sauvegarde quotidienne chiffrée (AES-256) de la base, conservée 14 jours dans deploy/backups.
  # Fichiers lisibles par root seulement ; sans BACKUP_PASSPHRASE, ils sont illisibles.
  backup:
    image: postgres:16 # variante Debian : contient openssl pour le chiffrement
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE manquant}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        umask 077
        chmod 700 /backups
        while true; do
          f=/backups/gestion-$$(date +%Y%m%d-%H%M).sql.gz.enc
          set -o pipefail
          if pg_dump -h db -U app_owner gestion | gzip | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$$f"; then
            echo "sauvegarde $$f"
          else
            echo "ÉCHEC de la sauvegarde" >&2; rm -f "$$f"
          fi
          find /backups -name 'gestion-*.sql.gz*' -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
