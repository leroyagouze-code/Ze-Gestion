import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

def version = new JsonSlurper().parse(file("version.json"))
// Signature : clé de production fournie par la CI (secrets) ; sinon clé de TEST publique (test-signing.p12),
// stable d'une version à l'autre pour pouvoir mettre à jour l'appli sans la désinstaller pendant les essais.
def keystorePath = System.getenv("ZE_KEYSTORE")

android {
    namespace "com.zegroup.gestion"
    compileSdk 35

    defaultConfig {
        applicationId "com.zegroup.gestion"
        minSdk 24
        targetSdk 35
        versionCode version.versionCode
        versionName version.versionName
    }

    // Un APK par processeur : Node et ses bibliothèques pèsent ~40 Mo par architecture
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }

    signingConfigs {
        release {
            storeFile file(keystorePath ?: "test-signing.p12")
            storePassword keystorePath ? System.getenv("ZE_KEYSTORE_PASSWORD") : "zegestion-test"
            keyAlias keystorePath ? System.getenv("ZE_KEY_ALIAS") : "zetest"
            keyPassword keystorePath ? System.getenv("ZE_KEY_PASSWORD") : "zegestion-test"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // jniLibs/<abi>/libzn_*.so (Node de Termux, voir build/fetch-node.mjs) : extraits sur le téléphone,
    // seul dossier d'où Android permet de lancer un programme
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += "**/libzn_*.so"
        }
    }

    androidResources {
        noCompress "zip"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
