<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZE LOYER</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="logo" aria-hidden="true">ZL</div>
  <h1>📶 Pas de connexion</h1>
  <p>ZE LOYER n'arrive pas à joindre le serveur. Vérifiez votre connexion internet (données mobiles ou Wi-Fi), puis réessayez.</p>
  <button id="retry" type="button">Réessayer</button>
  <small>Vos données sont en sécurité.</small>
  <script>
    document.getElementById("retry").addEventListener("click", async () => {
      try {
        const { serverUrl } = await (await fetch("config.json", { cache: "no-store" })).json();
        location.href = serverUrl ? serverUrl + "/connexion" : "index.html";
      } catch {
        location.reload();
      }
    });
  </script>
</body>
</html>
