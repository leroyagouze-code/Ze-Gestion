<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f5f3e; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; -webkit-app-region: drag; user-select: none; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      p { margin: 0; font-size: 13px; opacity: 0.85; }
      .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #fff; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>ZE LOYER</h1>
    <div class="bar"></div>
    <p id="status">Démarrage en cours…</p>
  </body>
</html>
